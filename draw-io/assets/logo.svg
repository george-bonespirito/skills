<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="draw-io skill logo">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background plate -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#plate)"/>
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#sheen)"/>

  <!-- connectors -->
  <g stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.92">
    <path d="M214 140 H298"/>
    <path d="M140 184 V372 H176"/>
    <path d="M372 184 V372 H336"/>
  </g>

  <!-- arrowheads into bottom node -->
  <g fill="#FFFFFF" opacity="0.92">
    <path d="M182 372 l-22 -13 v26 z"/>
    <path d="M330 372 l22 -13 v26 z"/>
  </g>

  <!-- nodes -->
  <g filter="url(#soft)">
    <rect x="66"  y="96"  width="148" height="88" rx="22" fill="#FFFFFF"/>
    <rect x="298" y="96"  width="148" height="88" rx="22" fill="#FFFFFF"/>
    <rect x="182" y="328" width="148" height="88" rx="22" fill="#FFFFFF"/>
  </g>

  <!-- node accents (rows, evoking shapes on a canvas) -->
  <g fill="#C7D2FE">
    <rect x="86"  y="120" width="80" height="12" rx="6"/>
    <rect x="86"  y="146" width="52" height="12" rx="6"/>
    <rect x="318" y="120" width="80" height="12" rx="6"/>
    <rect x="318" y="146" width="52" height="12" rx="6"/>
    <rect x="202" y="352" width="80" height="12" rx="6"/>
    <rect x="202" y="378" width="52" height="12" rx="6"/>
  </g>
</svg>
